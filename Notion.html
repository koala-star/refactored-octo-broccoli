<!DOCTYPE html>
<html>
    <head>
        <title>
            Notion
        </title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="styleN.css">
        <style>

            html {
                padding-left: clamp(0px, 0.4vw 70px) !important;
                padding-right:clamp(0px, 0.4vw, 70px) !important;
            }
            .title {
                display: flex;
                justify-content: center;
                align-items: center;
                gap: 10px;
                margin-top: 100px;
                transform: translateX(-5%);
                margin-bottom: 30px;
            }
            .title img {
                width: clamp(16px, 10vw, 80px);
                height: clamp(16px, 10vw, 80px);
            }

            .title h1{
                font-size: clamp(16px, 8vw, 70px);
                color: #333;
                margin: 0;
            }

            .List-comparatif ul {
                list-style: none;
                padding-left: 0;
                margin: 20px 0;
            }

            .List-comparatif li {
                margin-bottom: 8px;
            }

            .List-comparatif {
                display: flex;
                flex-direction: column;
                max-width: 30%;
                margin-top: 80px;
            }

            .List-comparatif h3 {
                text-align: center;
            }

            hr.separateur {
                width: 100%;
                max-width: auto; /* ou auto selon ton design */
                border: none;
                border-top: 1px solid #ccc;
                margin: 20px 0;
    }


            .Negatif li::before{
                content: "\2717";
                color: red;
                font-weight: bold;
                display: inline-block;
                width: 20px;
                margin-right: 8px;
            }
            .Positif li::before {
                content: "✔ "; /* ✔ */
                color: green;
                font-weight: bold;
                display: inline-block;
                width: 20px;
                margin-right: 8px;
            }

            .gallery-container {
                overflow-x: auto;
                overflow-y: hidden;
                width: 100%;
                padding: 20px;
            }
            
            .gallery {
                display: flex;
                gap: 20px;
                width: max-content;
            }
            
            .gallery img {
                height: 300px;
                border-radius: 10px;
                object-fit: cover;
                flex-shrink: 0;
            }
            
            .gallery-wrapper {
                position: relative;
                width: 100%;
                height: 300px;
                overflow: hidden;
            }    
            .gallery-container {
                overflow-x: auto;
                scroll-behavior: smooth;
                -webkit-overflow-scrolling: touch;
                padding: 0 20px;
                height: 100%;
            }
            .gallery {
                display: flex;
                gap: 20px;
                height: 100%;
                width: max-content;
            }
            
            .gallery img {
                height: 300px;
                border-radius: 10px;
                object-fit: cover;
                flex-shrink: 0;
            }
            
            .nav {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                color: black;
                background: none;
                border: none;
                font-size: 2rem;
                cursor: pointer;
                z-index: 10;
                border-radius: 50%;
            }
            
            .nav.left {
                left: 10px;
            }
            
            .nav.right {
                right: 10px;
            }

            #lightbox {
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0,0,0,0.8);
                display: flex;
                justify-content: center;
                align-items: center;
                z-index: 9999;
                flex-direction: column;
            }
            
            #lightbox img {
                max-width: 90vw;
                max-height: 80vh;
                border-radius: 10px;
                box-shadow: 0 0 20px black;
            }
            
            #closeLightbox {
                position: absolute;
                top: 20px;
                right: 30px;
                font-size: 2.5rem;
                background: transparent;
                border: none;
                color: white;
                cursor: pointer
            }
            
            .lightbox-nav {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                background: none;
                color: black;
                border: none;
                font-size: 3rem;
                padding: 10px 20px;
                cursor: pointer;
                border-radius: 50%;
                user-select: none;
        }
        
        .lightbox-nav.left {
            left: 20px;
        }
        
        .lightbox-nav.right {
            right: 20px;
        }

        .getNotion {
            margin-bottom: 50px;
            margin-left: clamp(0px, 0.4vw 70px) !important;
            margin-right:clamp(0px, 0.4vw, 70px) !important;
        }

        .getNotion a{
            text-decoration: none !important;
            color: inherit;
            padding: 1% 3%;
            background-color:rgb(109, 109, 109);
            border-radius: 5px;
        }
        
        </style>
    </head>

    <body>
        <div class="title">
            <img src="data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3e%3ctitle%3eNotion%3c/title%3e%3cpath fill='%233F3E42' d='M4.459 4.208c.746.606 1.026.56 2.428.466l13.215-.793c.28 0 .047-.28-.046-.326L17.86 1.968c-.42-.326-.981-.7-2.055-.607L3.01 2.295c-.466.046-.56.28-.374.466zm.793 3.08v13.904c0 .747.373 1.027 1.214.98l14.523-.84c.841-.046.935-.56.935-1.167V6.354c0-.606-.233-.933-.748-.887l-15.177.887c-.56.047-.747.327-.747.933zm14.337.745c.093.42 0 .84-.42.888l-.7.14v10.264c-.608.327-1.168.514-1.635.514-.748 0-.935-.234-1.495-.933l-4.577-7.186v6.952L12.21 19s0 .84-1.168.84l-3.222.186c-.093-.186 0-.653.327-.746l.84-.233V9.854L7.822 9.76c-.094-.42.14-1.026.793-1.073l3.456-.233 4.764 7.279v-6.44l-1.215-.139c-.093-.514.28-.887.747-.933zM1.936 1.035l13.31-.98c1.634-.14 2.055-.047 3.082.7l4.249 2.986c.7.513.934.653.934 1.213v16.378c0 1.026-.373 1.634-1.68 1.726l-15.458.934c-.98.047-1.448-.093-1.962-.747l-3.129-4.06c-.56-.747-.793-1.306-.793-1.96V2.667c0-.839.374-1.54 1.447-1.632'/%3e%3c/svg%3e">
            <h1>Notion</h1>
        </div>
        <div class="getNotion">
            <a href="">
                Install Notion
            </a>
        </div>
        <div class="gallery-wrapper">
            <button class="nav left">‹</button>
            <div class="gallery-container">
                <div class="gallery">
                    <img src="image1.png" alt="App image 1">
                    <img src="image2.png" alt="App image 2">
                    <img src="image3.png" alt="App image 3">
                    <!-- Ajoute autant d'images que tu veux -->
                </div>
            </div>
            <button class="nav right">›</button>
        </div>
        <script>
        const galleryContainer = document.querySelector('.gallery-container');
        const leftBtn = document.querySelector('.nav.left');
        const rightBtn = document.querySelector('.nav.right');
        leftBtn.addEventListener('click', () => {
            galleryContainer.scrollBy({
                left: -galleryContainer.offsetWidth * 0.8,
                behavior: 'smooth'
            });
        });
        rightBtn.addEventListener('click', () => {
            galleryContainer.scrollBy({
                left: galleryContainer.offsetWidth * 0.8,
                behavior: 'smooth'
            });
            });
        </script>
            <div id="lightbox" style="display:none;">
                <button id="closeLightbox">×</button>
                <button id="prevImage" class="nav lightbox-nav left">‹</button>
                <img id="lightboxImage" src="" alt="Large view" />
                <button id="nextImage" class="nav lightbox-nav right">›</button>
            </div>
            <script>
                const images = document.querySelectorAll('.gallery img');
                const lightbox = document.getElementById('lightbox');
                const lightboxImage = document.getElementById('lightboxImage');
                const closeLightboxBtn = document.getElementById('closeLightbox');
                const prevBtn = document.getElementById('prevImage');
                const nextBtn = document.getElementById('nextImage');
                
                let currentIndex = 0;
                
                function openLightbox(index) {
                    currentIndex = index;
                    lightboxImage.src = images[currentIndex].src;
                    lightbox.style.display = 'flex';
                }

                function closeLightbox() {
                    lightbox.style.display = 'none';
                }
                
                function showPrevImage() {
                    currentIndex = (currentIndex - 1 + images.length) % images.length;
                    lightboxImage.src = images[currentIndex].src;
                }
                
                function showNextImage() {
                    currentIndex = (currentIndex + 1) % images.length;
                    lightboxImage.src = images[currentIndex].src;
                }
                
                // Ouvre lightbox au clic sur une image
                images.forEach((img, index) => {
                    img.style.cursor = 'pointer';
                    img.addEventListener('click', () => openLightbox(index));
                });
                
                // Ferme lightbox au clic sur bouton close
                closeLightboxBtn.addEventListener('click', closeLightbox);
                
                // Navigation flèches lightbox
                prevBtn.addEventListener('click', showPrevImage);
                nextBtn.addEventListener('click', showNextImage);
                
                // Fermer lightbox si clic en dehors de l’image
                lightbox.addEventListener('click', (e) => {
                    if (e.target === lightbox) {
                        closeLightbox();
                    }
                });
            </script>
            <div class="List-comparatif">
            <h3>Comparatif</h3>
            <h4 style="color: green;">Point+ </h4>
            <ul class="Positif">
                <li>Application très complète</li>
                <li>Template majoritairement gratuit</li>
            </ul>
            <hr class="separateur">
            <h4 style="color: red;">Point - </h4>
            <ul class="Negatif">
                <li>Peut être complex au début</li>
                <li>Ralenti avec beaucou de donnés</li>
                <li>N'envoie pas de notification</li>
            </ul>
        </div>
    </body>
</html>
